# crypto-mlp: 数据定时刷新（CoinGecko / 交易所公共 API，免费源优先）
name: Data Refresh (Crypto)
on:
  schedule:
    # 每小时刷新一次加密货币行情
    - cron: '15 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Refresh crypto market data
        run: |
          python3 - <<'PY'
          import os, json, datetime
          # MVP 占位：接 CoinGecko 免费公共 API 拉行情喂 data_fetcher
          os.makedirs("models", exist_ok=True)
          ts = datetime.datetime.now().isoformat()
          json.dump({"ts": ts, "note": "MVP 占位，接 CoinGecko 后填充"},
                    open("models/last_refresh.json","w"), indent=2)
          print("refresh @", ts)
          PY
      - name: Commit refresh snapshot
        run: |
          git config user.name "crypto-bot"; git config user.email "bot@example.com"
          git add models/last_refresh.json && (git commit -m "chore(crypto-mlp): 行情刷新 $(date -u +%FT%TZ)" || echo "no change"); git push
