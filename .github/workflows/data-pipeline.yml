# crypto-mlp: 数据定时刷新（CoinGecko / 交易所公共 API，免费源优先）
name: Data Refresh (Crypto)
on:
  schedule:
    # 每小时刷新一次加密货币行情
    - cron: '15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Refresh crypto market data (CoinGecko，拉不到自动回退占位)
        run: python refresh_report.py
      - name: Commit refresh snapshot
        run: |
          git config user.name "crypto-bot"; git config user.email "bot@example.com"
          git add models/last_refresh.json && (git commit -m "chore(crypto-mlp): 行情刷新 $(date -u +%FT%TZ)" || echo "no change"); git push

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/deploy-pages@v4
        with:
          page: web

  pages:
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - uses: actions/checkout@v4
      - name: Deploy models snapshot
        run: |
          mkdir -p .github && echo 'crypto-mlp' > .github/URL
      - name: Publish to Pages
        uses: actions/deploy-pages@v4
        with:
          page: web
